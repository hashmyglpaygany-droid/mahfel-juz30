<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fffdf7"><title>مدرسه محفل | قرآن برای کودکان</title><link rel="stylesheet" href="style.css"></head><body><div id="app"></div><script src="app.js" defer></script><style id="mahfel-music-css">#mahfelMusic{position:fixed;bottom:18px;left:18px;z-index:9999;border:1px solid #bee5da;background:#ecfff7;color:#166b60;border-radius:32px;padding:11px 15px;font:bold 13px Tahoma,Arial;box-shadow:0 4px 15px #14564622;cursor:pointer}#mahfelMusic:focus{outline:3px solid #6ecfb9}</style><button id="mahfelMusic" type="button" aria-pressed="false">♫ موسیقی: خاموش</button><script>(function(){'use strict';var ctx,playing=false,nextTimer=null,idx=0;var notes=[392,440,523.25,440,392,329.63,349.23,392,329.63,293.66,329.63,392,349.23,329.63,293.66,261.63];var btn=document.getElementById('mahfelMusic');function tone(f){if(!ctx||!playing)return;var o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.017,ctx.currentTime+.08);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.4);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.42)}function tick(){if(!playing)return;tone(notes[idx++%notes.length]);nextTimer=setTimeout(tick,530)}function halt(){playing=false;if(nextTimer)clearTimeout(nextTimer);nextTimer=null;btn.textContent='♫ موسیقی: خاموش';btn.setAttribute('aria-pressed','false')}btn.addEventListener('click',function(){if(playing){halt();return}var AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx){btn.textContent='صدا در این مرورگر پشتیبانی نمی‌شود';return}if(!ctx)ctx=new AudioCtx();ctx.resume().then(function(){playing=true;btn.textContent='♫ موسیقی: روشن';btn.setAttribute('aria-pressed','true');tick()}).catch(function(){btn.textContent='پخش موسیقی امکان‌پذیر نیست'})});document.addEventListener('visibilitychange',function(){if(document.hidden)halt()});var rec=document.getElementById('recitation');if(rec)rec.addEventListener('play',halt)})();</script></body></html>
