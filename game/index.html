<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>راز شش نور | مدرسه محفل</title><style>
*{box-sizing:border-box}body{margin:0;background:#fffaf1;color:#295262;font:16px Tahoma,Arial,sans-serif}button{font:inherit;cursor:pointer;border:0}a{color:#147f82;text-decoration:none}header{display:flex;align-items:center;justify-content:space-between;padding:12px max(14px,calc((100vw - 970px)/2));background:#fff;border-bottom:1px solid #e8ece4}main{max-width:970px;margin:auto;padding:10px 14px}.shell{border:1px solid #e0eee6;border-radius:26px;background:linear-gradient(138deg,#effbff,#fffaf1);padding:clamp(12px,2.5vw,24px);box-shadow:0 12px 34px #124c4b12;min-height:560px}h1{font-size:clamp(22px,4vw,31px);margin:10px 0 4px}h2{font-size:clamp(19px,3vw,25px);margin:10px 0}p{line-height:1.75;margin:8px 0}.muted{color:#68868a;font-size:13px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.tag{font-size:12px;border-radius:40px;background:#ddf5e8;padding:9px 13px;color:#237d70}.progress{height:9px;border-radius:15px;background:#d9ede7;overflow:hidden;margin:14px 0}.progress>span{height:100%;background:#39b89f;display:block;transition:width .2s}.lanterns{display:flex;justify-content:center;gap:clamp(1px,1.5vw,13px);margin:7px 0 13px;padding:11px 0;border-radius:18px;background:linear-gradient(140deg,#d6f4ed,#fff9d9)}.lamp{width:clamp(42px,12%,97px);text-align:center}.lamp svg{width:100%;height:110px;overflow:visible;filter:drop-shadow(0 2px 3px #b68b4560)}.lamp .aura{opacity:0}.lamp.learning .aura{opacity:.45}.lamp.done .aura{opacity:1}.lamp.done svg{animation:sway 4s ease-in-out infinite alternate}.lamp small{display:block;color:#527b78;font-size:11px}@keyframes sway{0%{transform:rotate(-2deg)}100%{transform:rotate(2deg)}}.panel{text-align:center;background:#fff;border:1px solid #e4eee6;border-radius:20px;min-height:260px;padding:15px}.verse{font-family:serif;font-size:clamp(26px,5vw,40px);line-height:2;direction:rtl;padding:14px 5px;min-height:96px}.btn{padding:13px 19px;border-radius:15px;min-height:47px;background:#32b99e;color:white}.alt{background:#e6f4f8;color:#265b68}.gold{background:#ffdfa0;color:#785020}.buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}.choices{display:grid;gap:9px;max-width:610px;margin:14px auto}.choices button{background:#f1faff;color:#255463;text-align:right;border:2px solid #d7e9e8;border-radius:14px;padding:13px}.choices button.good{background:#dffbef;border-color:#27b884}.choices button.bad{background:#fff0ec;border-color:#e69f88}.footerButtons{display:flex;justify-content:space-between;gap:10px;margin:15px 0 0}.footerButtons button{flex:1}.timer{font-weight:bold;font-size:clamp(40px,9vw,64px);color:#189b8b}.notice{font-size:13px;color:#73868a;min-height:25px}.photo{height:90px;border-radius:15px;margin:7px auto;max-width:450px;background:#e7f4ed url('../assets/kidfirst.webp') center 35%/cover no-repeat}.photo.none{background:#e7f4ed;display:flex;align-items:center;justify-content:center}.audioControls{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}footer{text-align:center;font-size:12px;color:#87969a;margin:15px}.hide{display:none!important}@media(max-width:520px){.lamp svg{height:76px}.shell{min-height:530px}.panel{min-height:295px;padding:10px}.photo{height:65px}.lanterns{gap:0}.btn{padding:11px 9px}.footerButtons{gap:6px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
/* Approved warm children's visual identity */
body{background:#fffdf7;color:#314158;font-family:Tahoma,Arial,sans-serif}
header{background:#ffffffed;color:#137a80;border-bottom:1px solid #e6f1eb}
main{max-width:1080px}
.shell{background:#fff; border:1px solid #e8f2e8;border-radius:30px;box-shadow:0 14px 38px #295f6513;padding:clamp(12px,2.6vw,24px)}
.lanterns{background:linear-gradient(180deg,#f5fcfb 2%,#fff7e6 100%);border:1px solid #e6f2e8;padding:12px 8px 8px;gap:clamp(2px,1.6vw,12px);align-items:end}

.lamp.done .aura{opacity:1}.lamp.done .flame{opacity:1}
.lamp.done svg{animation:lampfloat 4s ease-in-out infinite alternate}

.panel{background:linear-gradient(125deg,#f3faff,#fffdf8);border-color:#e7f0eb;box-shadow:none}

<header><strong>🌿 مدرسه محفل</strong><nav><a href="../index.html">خانه و سوره‌ها</a>　<a href="../admin.html">مدیریت</a></nav></header>
<main><div class="top"><span class="tag" id="status">سوره ناس • بازی حفظ</span><span class="muted" id="fraction">۱ / ۱۹</span></div><div class="progress"><span id="progress" style="width:0"></span></div><div class="shell"><h1 id="heading">راز شش نور ✨</h1><p class="muted" id="subtitle">گوش کن، تمرین کن، پیدا کن و از حفظ بخوان</p><div class="lanterns" id="lamps"></div><section class="panel"><div id="photo" class="photo" role="img" aria-label="کودکان مدرسه محفل"></div><div id="content"></div><div class="notice" id="notice" aria-live="polite"></div></section><div class="footerButtons"><button id="prev" class="btn alt">مرحله قبل</button><button id="next" class="btn">شروع بازی ←</button></div></div><footer>هر آیه یک قدم به حفظ نزدیک‌تر • تشخیص خودکار صحت تلاوت هنوز فعال نیست</footer></main><audio id="recitation" preload="none"></audio>
<script>
(function(){'use strict';var V=['قُلْ أَعُوذُ بِرَبِّ النَّاسِ','مَلِكِ النَّاسِ','إِلَٰهِ النَّاسِ','مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ','الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ','مِنَ الْجِنَّةِ وَالنَّاسِ'];var st=0,seen=0,mastered=0,ans=false,flip=true,count=0,timer=null,audio=document.getElementById('recitation');var N=19;try{var s=JSON.parse(localStorage.getItem('mahfel_juz30_game_v8')||'{}');seen=Math.max(0,Math.min(6,s.seen||0));mastered=Math.max(0,Math.min(6,s.mastered||0))}catch(e){}function $(x){return document.getElementById(x)}function save(){try{localStorage.setItem('mahfel_juz30_game_v8',JSON.stringify({seen:seen,mastered:mastered}))}catch(e){}}function stop(){if(timer){clearInterval(timer);timer=null}audio.pause();audio.removeAttribute('src')}function lamp(n){var type=n<=mastered?'done':n<=seen?'learning':'';var grad='gold'+n,glow='light'+n;return '<div class="lamp '+type+'"><svg viewBox="0 0 90 145" xmlns="http://www.w3.org/2000/svg" aria-label="فانوس '+n+'"><defs><linearGradient id="'+grad+'" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff4bb"/><stop offset=".30" stop-color="#f4bb58"/><stop offset=".67" stop-color="#c67a25"/><stop offset="1" stop-color="#ffdf88"/></linearGradient><radialGradient id="'+glow+'"><stop stop-color="#fff9bc" stop-opacity=".95"/><stop offset=".55" stop-color="#ffe282" stop-opacity=".5"/><stop offset="1" stop-color="#ffdb84" stop-opacity="0"/></radialGradient></defs><ellipse class="aura" cx="45" cy="83" rx="43" ry="56" fill="url(#'+glow+')"/><g stroke="#a96518" stroke-width="2" stroke-linejoin="round"><circle cx="45" cy="11" r="8" fill="none"/><circle cx="45" cy="20" r="5" fill="#f8d072"/><path fill="url(#'+grad+')" d="M30 24h30l8 11-3 8H25l-3-8z"/><path d="M23 43h44v69H23z" fill="url(#'+grad+')"/><path d="M29 48H61V105H29Z" fill="#175e75"/><path d="M31 50H59V103H31Z" fill="#fff7d5" opacity=".9"/><path d="M31 56Q45 36 59 56V99H31Z" fill="#ffffff" opacity=".26" stroke="#bf7b28"/><path d="M23 47h44M23 108h44" stroke="#fce1a1" stroke-width="5"/><path d="M20 111h50l-6 12H26z" fill="url(#'+grad+')"/><path d="M27 124h36l-8 8H35Z" fill="#f5c164"/><path d="M28 46v62M62 46v62M33 58L45 47l12 11" stroke="#be792c" fill="none"/><path d="M35 64L45 55l10 9M35 96L45 85l10 11" stroke="#e1a04d" fill="none"/></g><g fill="#0d6179"><path d="m44 34 1-5 1 5 5 1-5 2-1 5-1-5-5-2z"/><circle cx="32" cy="36" r="2"/><circle cx="58" cy="36" r="2"/></g><path class="flame" d="M45 97C25 82 42 69 45 64C55 78 60 87 45 97Z" fill="#f8b63d"/><path class="flame" d="M45 96C37 88 43 83 45 77C50 85 51 91 45 96Z" fill="#fff8bd"/></svg><small>'+n+'</small></div>'}function render(){stop();ans=false;flip=true;$('lamps').innerHTML=[1,2,3,4,5,6].map(lamp).join('');$('fraction').textContent=(st+1)+' / '+N;$('progress').style.width=Math.round(st/(N-1)*100)+'%';$('prev').disabled=st===0;$('next').style.display='';$('notice').textContent='';var c=$('content');c.innerHTML='';$('photo').style.display=st===0||st===18?'block':'none';var i;if(st===0){$('heading').textContent='راز شش نور ✨';$('subtitle').textContent='ماجراجویی حفظ سوره ناس';c.innerHTML='<p>شش فانوس منتظر تو هستند. آیات را تمرین کن، در بازی‌ها جواب بده و در پایان از حفظ بخوان.</p>';$('next').textContent='شروع آموزش ←'}else if(st<=6){i=st-1;$('heading').textContent='آموزش آیه '+st;$('subtitle').textContent='بخوان و تکرار کن';c.innerHTML='<div class="verse">'+V[i]+'</div><div class="audioControls"><button class="btn alt" id="play">▶ پخش تلاوت</button><span class="muted">اگر صوت بارگذاری نشده باشد، پیام می‌بینی</span></div>';$('play').onclick=function(){var fname=('0'+(i+1)).slice(-2);audio.src='../audio/teacher_'+fname+'.mp3';audio.play().catch(function(){$('notice').textContent='صوت این آیه هنوز بارگذاری نشده است.'})};$('next').textContent='تمرین کردم ←'}else if(st<=12){i=st-7;$('heading').textContent='فلش‌کارت آیه '+(i+1);$('subtitle').textContent='از حفظ بگو، سپس کارت را برگردان';c.innerHTML='<div class="verse" id="face">'+V[i]+'</div><button class="btn gold" id="flip">پنهان کن</button>';$('flip').onclick=function(){flip=!flip;$('face').textContent=flip?V[i]:'✦ ✦ ✦';$('flip').textContent=flip?'پنهان کن':'نمایش پاسخ'};$('next').textContent='کارت بعدی ←'}else if(st<=14){i=st===13?1:4;var ids=st===13?[0,1,2]:[3,4,5];$('heading').textContent='کدام آیه است؟';$('subtitle').textContent='شماره آیه صحیح را انتخاب کن';c.innerHTML='<div class="verse">'+V[i]+'</div><div class="choices">'+ids.map(function(v){return '<button data-n="'+v+'">آیه '+(v+1)+'</button>'}).join('')+'</div>';Array.prototype.forEach.call(c.querySelectorAll('[data-n]'),function(b){b.onclick=function(){if(ans)return;var ok=+b.getAttribute('data-n')===i;b.className=ok?'good':'bad';$('notice').textContent=ok?'آفرین! درست بود.':'دوباره تلاش کن.';if(ok)ans=true}});$('next').textContent='ادامه ←'}else if(st===15){$('heading').textContent='ترتیب آیات';$('subtitle').textContent='آیات اول تا سوم را به ترتیب انتخاب کن';count=0;c.innerHTML='<div class="choices">'+[2,0,1].map(function(v){return '<button data-n="'+v+'">'+V[v]+'</button>'}).join('')+'</div>';Array.prototype.forEach.call(c.querySelectorAll('[data-n]'),function(b){b.onclick=function(){if(+b.getAttribute('data-n')===count){b.disabled=true;b.className='good';count++;$('notice').textContent=count===3?'همه درست شدند!':'درست است؛ بعدی کدام است؟'}else $('notice').textContent='دوباره تلاش کن.'}});$('next').textContent='آزمون حفظ ←'}else if(st<=17){i=st===16?0:3;$('heading').textContent='آزمون از حفظ';$('subtitle').textContent=st===16?'سه آیه اول را بخوان':'سه آیه آخر را بخوان';c.innerHTML='<div class="timer" id="clock">۳۰</div><button class="btn alt" id="reveal">نمایش پاسخ‌ها</button><div id="answer" class="verse hide">'+V.slice(i,i+3).join(' ۞ ')+'</div>';var sec=30;timer=setInterval(function(){sec--;if($('clock'))$('clock').textContent=sec;if(sec<=0){clearInterval(timer);timer=null}},1000);$('reveal').onclick=function(){$('answer').className='verse';if(timer){clearInterval(timer);timer=null}};$('next').textContent='تلاش کردم ←'}else{$('heading').textContent='آفرین! ✨';$('subtitle').textContent='مسیر بازی را تا پایان آمدی';c.innerHTML='<p>برای حفظ مطمئن‌تر، سوره را یک بار کامل بدون متن و با همراهی مربی بخوان.</p><button id="restart" class="btn alt">شروع دوباره</button>';$('restart').onclick=function(){st=0;render()};$('next').style.display='none'}}$('next').onclick=function(){if(st>=1&&st<=6){seen=Math.max(seen,st);save()}if(st===16){mastered=Math.max(mastered,3);save()}if(st===17){mastered=Math.max(mastered,6);save()}st=Math.min(18,st+1);render()};$('prev').onclick=function(){st=Math.max(0,st-1);render()};render();
})();
</script><style id="mahfel-music-css">#mahfelMusic{position:fixed;bottom:18px;left:18px;z-index:9999;border:1px solid #bee5da;background:#ecfff7;color:#166b60;border-radius:32px;padding:11px 15px;font:bold 13px Tahoma,Arial;box-shadow:0 4px 15px #14564622;cursor:pointer}#mahfelMusic:focus{outline:3px solid #6ecfb9}</style><button id="mahfelMusic" type="button" aria-pressed="false">♫ موسیقی: خاموش</button><script>(function(){'use strict';var ctx,playing=false,nextTimer=null,idx=0;var notes=[392,440,523.25,440,392,329.63,349.23,392,329.63,293.66,329.63,392,349.23,329.63,293.66,261.63];var btn=document.getElementById('mahfelMusic');function tone(f){if(!ctx||!playing)return;var o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.017,ctx.currentTime+.08);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.4);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.42)}function tick(){if(!playing)return;tone(notes[idx++%notes.length]);nextTimer=setTimeout(tick,530)}function halt(){playing=false;if(nextTimer)clearTimeout(nextTimer);nextTimer=null;btn.textContent='♫ موسیقی: خاموش';btn.setAttribute('aria-pressed','false')}btn.addEventListener('click',function(){if(playing){halt();return}var AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx){btn.textContent='صدا در این مرورگر پشتیبانی نمی‌شود';return}if(!ctx)ctx=new AudioCtx();ctx.resume().then(function(){playing=true;btn.textContent='♫ موسیقی: روشن';btn.setAttribute('aria-pressed','true');tick()}).catch(function(){btn.textContent='پخش موسیقی امکان‌پذیر نیست'})});document.addEventListener('visibilitychange',function(){if(document.hidden)halt()});var rec=document.getElementById('recitation');if(rec)rec.addEventListener('play',halt)})();</script></body></html>
